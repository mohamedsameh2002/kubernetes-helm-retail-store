apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orders
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mohamedsameh2002/kubernetes-helm-retail-store.git
    targetRevision: main
    path: helm/orders-chart
    helm:
      valueFiles:
        - values-orders.yaml
    # ned checkr here to decide is values prodaction or dev
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true    # Auto-delete resources not in Git
      selfHeal: true # Auto-sync if drift detected
    syncOptions:
      - CreateNamespace=true